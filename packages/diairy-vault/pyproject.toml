[project]
name = "diairy-vault"
version = "0.1.0"
description = "Raw Markdown sources, their git history, and deterministic segmentation."
requires-python = ">=3.12"
dependencies = [
    "diairy-core",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diairy"]

[tool.uv.sources]
diairy-core = { workspace = true }
