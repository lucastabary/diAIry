[project]
name = "diairy-query"
version = "0.1.0"
description = "Hybrid retrieval, graph traversal and cited answers over the journal."
requires-python = ">=3.12"
dependencies = [
    "diairy-core",
    "diairy-nlp",
    "diairy-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diairy"]

[tool.uv.sources]
diairy-core = { workspace = true }
diairy-nlp = { workspace = true }
diairy-store = { workspace = true }
