[project]
name = "diairy-nlp"
version = "0.1.0"
description = "Model providers, constrained extraction, deterministic enrichment and canonicalisation."
requires-python = ">=3.12"
dependencies = [
    "diairy-core",
    "httpx>=0.27",
    "numpy>=2.1",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diairy"]

[tool.uv.sources]
diairy-core = { workspace = true }
