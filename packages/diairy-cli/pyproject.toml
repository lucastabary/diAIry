[project]
name = "diairy-cli"
version = "0.1.0"
description = "The diAIry command line."
requires-python = ">=3.12"
dependencies = [
    "diairy-core",
    "diairy-nlp",
    "diairy-pipeline",
    "diairy-query",
    "diairy-store",
    "diairy-vault",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
diairy = "diairy.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diairy"]

[tool.uv.sources]
diairy-core = { workspace = true }
diairy-nlp = { workspace = true }
diairy-pipeline = { workspace = true }
diairy-query = { workspace = true }
diairy-store = { workspace = true }
diairy-vault = { workspace = true }
