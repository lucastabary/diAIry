[project]
name = "diairy-core"
version = "0.1.0"
description = "Domain model, identifiers, provenance and the network egress guard."
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diairy"]
