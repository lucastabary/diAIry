[project]
name = "diairy-pipeline"
version = "0.1.0"
description = "Stage orchestration, incremental processing and the full run log."
requires-python = ">=3.12"
dependencies = [
    "diairy-core",
    "diairy-nlp",
    "diairy-store",
    "diairy-vault",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diairy"]

[tool.uv.sources]
diairy-core = { workspace = true }
diairy-nlp = { workspace = true }
diairy-store = { workspace = true }
diairy-vault = { workspace = true }
