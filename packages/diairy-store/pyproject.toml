[project]
name = "diairy-store"
version = "0.1.0"
description = "The append-only fact log, full-text and vector indexes, and the graph projection."
requires-python = ">=3.12"
dependencies = [
    "diairy-core",
    "kuzu>=0.6",
    "numpy>=2.1",
    "sqlite-vec>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diairy"]

[tool.uv.sources]
diairy-core = { workspace = true }
